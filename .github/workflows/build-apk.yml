name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      
      - name: Install dependencies
        run: npm install

      - name: Prebuild android project
        run: npx expo prebuild --platform android --no-install
      
      - name: Sign release APK
        working-directory: android
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jrkg-learning-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jrkg-learning-app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          retention-days: 7